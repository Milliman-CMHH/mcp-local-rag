version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(actions):"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(python):"
    groups:
      all:
        patterns: ["*"]

  # Copilot CLI used by the Dependabot fix workflow.
  - package-ecosystem: npm
    directory: /.github/copilot-cli
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(copilot-cli):"
    open-pull-requests-limit: 1
    # CI never runs the CLI, so wait a week for a bad release to be pulled.
    cooldown:
      default-days: 7
